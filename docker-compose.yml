services:
  postgres:
    image: postgres:16-alpine
    container_name: codemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codemind
      POSTGRES_PASSWORD: codemind
      POSTGRES_DB: codemind
    ports:
      - "5432:5432"
    volumes:
      - codemind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemind -d codemind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codemind_pgdata:
